name: Bug Report
description: Create a report to help us improve provBookR
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out a bug report!
  - type: input
    id: environment
    attributes:
      label: R & OS Version
      description: What version of R and OS are you using? (e.g. R 4.3.1 on macOS 14)
      placeholder: "e.g. R 4.3.1, macOS Sonoma"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal reproducible R code script to reproduce the behavior.
      placeholder: |
        1. Run `publish_codex("script.R")`
        2. Open `codex_build/index.html`
        3. Observe issue...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
