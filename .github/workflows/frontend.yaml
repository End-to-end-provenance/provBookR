name: frontend.yaml

on:
  push:
    branches: [main, master, summer-testing]
  pull_request:

permissions: read-all

jobs:
  frontend-check:
    name: SvelteKit TypeScript & Vitest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inst/codex_template

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: inst/codex_template/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck with svelte-check
        run: npm run check

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build static digital booklet
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
